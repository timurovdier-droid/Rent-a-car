<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GTA Rent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Rent a car — GTA</title>
  <script>
    try {
      var saved = localStorage.getItem('rac-theme');
      var dark = saved ? saved === 'dark' : true;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
    window.addEventListener('error', function (e) {
      var src = e.target && (e.target.src || e.target.href) || '';
      if (src.indexOf('/assets/') === -1) return;
      try {
        if (sessionStorage.getItem('rac-reloaded')) return;
        sessionStorage.setItem('rac-reloaded', '1');
      } catch (err) {}
      location.reload();
    }, true);
    window.addEventListener('vite:preloadError', function () { location.reload(); });
    setTimeout(function () { try { sessionStorage.removeItem('rac-reloaded'); } catch (e) {} }, 15000);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
